<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Foliage</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="brand">Foliage<span>.</span></a>
      <nav class="nav-links" id="user-slot"></nav>
      <nav class="nav-links">
        <a href="/pages/cart.html">Cart <span class="cart-badge" id="cart-count" style="display:none">0</span></a>
      </nav>
    </div>
  </header>

  <div class="auth-wrap">
    <h1>Welcome back</h1>
    <p class="sub">Log in to continue to your cart and orders.</p>
    <div class="form-error" id="form-error"></div>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
    <div class="switch-link">New here? <a href="/pages/register.html">Create an account</a></div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("form-error");
      errorBox.classList.remove("show");
      try {
        await api("/auth/login", {
          method: "POST",
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get("redirect") === "cart" ? "/pages/cart.html" : "/";
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add("show");
      }
    });
  </script>
</body>
</html>
